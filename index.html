<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titoro Games</title>
<style>
  :root { --bg:#faf8ff; --fg:#2d2a3e; --muted:#6d6886; --accent:#7a5cf0; --card:#fff; --line:#e6e1f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17151f; --fg:#ece9f7; --muted:#a39fbb; --accent:#a48cff; --card:#211e2c; --line:#332f43; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  p.lead { color:var(--muted); margin:0 0 32px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  .card h2 { margin:0 0 6px; font-size:1.2rem; }
  a { color:var(--accent); }
  footer { color:var(--muted); font-size:.9rem; margin-top:40px; }
</style>
</head>
<body>
<main>
  <h1>Titoro Games</h1>
  <p class="lead">Small, cozy mobile games.</p>
  <div class="card">
    <h2>Looping Dots : Color Sort</h2>
    <p>A relaxing pixel-picture colour sorting puzzle.</p>
    <p><a href="loopingdots/privacy.html">Privacy Policy</a> · <a href="loopingdots/privacy.html#ko">개인정보처리방침</a></p>
  </div>
  <footer>Contact: <a href="mailto:titorogames@gmail.com">titorogames@gmail.com</a></footer>
</main>
</body>
</html>
